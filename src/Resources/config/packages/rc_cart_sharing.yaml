# Eigene Begrenzung für das Speichern von Warenkörben.
#
# Der Weg ist ohne Anmeldung erreichbar und legt je Aufruf eine Zeile an. Ohne Begrenzung genügt
# eine Schleife, um die Tabelle zu füllen, und die Aufräum-Aufgabe löscht nur, was abgelaufen ist,
# also frühestens nach der eingestellten Haltbarkeit.
#
# `time_backoff` liest die Staffel so: Die ersten zehn Aufrufe gehen ungebremst durch, bis zum
# dreißigsten muss zwischen zwei Aufrufen eine Minute liegen, danach zehn Minuten. Eine Stunde nach
# dem letzten angenommenen Aufruf beginnt die Zählung von vorn. Zehn freie Aufrufe reichen für den Kunden, der
# mehrmals speichert, weil er den Namen ändern wollte; eine Maschine landet nach kurzer Zeit bei
# einem Aufruf alle zehn Minuten.
shopware:
    api:
        rate_limiter:
            rc_cart_sharing_save:
                enabled: true
                policy: 'time_backoff'
                reset: '1 hour'
                limits:
                    - limit: 10
                      interval: '60 seconds'
                    - limit: 30
                      interval: '600 seconds'

            # Der Versand ist enger begrenzt als das Speichern: Eine Nachricht verlässt den Shop
            # und trägt seine Absenderadresse. Drei Nachrichten gehen sofort, bis zur zehnten liegen
            # je zehn Minuten dazwischen, danach ein Tag. Das reicht für den Kunden, der sich
            # vertippt hat, und nicht für einen Verteiler.
            rc_cart_sharing_send:
                enabled: true
                policy: 'time_backoff'
                reset: '1 hour'
                limits:
                    - limit: 3
                      interval: '600 seconds'
                    - limit: 10
                      interval: '86400 seconds'
